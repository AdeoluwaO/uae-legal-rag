# UAE legal corpus manifest
#
# Each entry describes one document in input_corpus/data/. Every PDF
# listed here is present locally; no network fetch is required.
#
# Field conventions:
#   law_id                  - unique identifier for cross-referencing
#   filename                - matches the file in input_corpus/data/
#   jurisdiction            - federal_uae | difc_free_zone
#   instrument_type         - federal_law | federal_decree_law
#                             | cabinet_decision | difc_law
#   status                  - in_force | repealed
#   supersedes              - law_id this document replaced (or null)
#   repealed_by             - law_id that replaced this one (only if repealed)
#   implements              - law_id this document is an executive regulation
#                             of (only for cabinet_decision / exec regs)
#   source_note             - free-form notes on provenance, consolidation
#                             status, and known content characteristics

corpus_version: "1.0"
corpus_date: 2026-04-19
language: english
total_documents: 12

